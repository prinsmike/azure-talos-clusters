# Echo Test App - Verify Cilium Ingress
# Deploys a simple echo server to test ingress connectivity.
#
# The host lives under the internal apps zone (apps.int.example.com), so once
# external-dns is running it creates the DNS record automatically - no PR needed.
# See kubernetes/infrastructure/external-dns/ and docs/adr/0008-dns-delegated-self-service.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: echo-test
  labels:
    app.kubernetes.io/name: echo-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: echo-test
  labels:
    app.kubernetes.io/name: echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-server
    spec:
      containers:
        - name: echo-server
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: echo-test
  labels:
    app.kubernetes.io/name: echo-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: echo-server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-server
  namespace: echo-test
  labels:
    app.kubernetes.io/name: echo-server
spec:
  ingressClassName: cilium
  rules:
    - host: echo.apps.int.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-server
                port:
                  number: 80
