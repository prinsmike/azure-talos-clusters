# Internal CA ClusterIssuer for internal apps (*.apps.int.example.com)
#
# apps.int.example.com is a PRIVATE DNS zone, so Let's Encrypt DNS-01 (which needs
# public resolution) cannot issue for it. Internal apps therefore get certificates
# from an in-cluster CA instead. See docs/adr/0008-dns-delegated-self-service.md.
#
# Public apps on example.com keep using the cert-manager Let's Encrypt DNS-01 flow
# (see cluster-issuers.yaml) via the public-zone-scoped workload identity.
#
# Trust: distribute the root CA certificate (the "internal-ca-root" secret below) to
# client machines / via the private-access solution so internal HTTPS is trusted.
#
# Chain: selfsigned issuer -> root CA Certificate -> CA ClusterIssuer -> leaf certs.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: talos-internal-ca
  secretName: internal-ca-root
  duration: 87600h    # 10 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: internal-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca-root
