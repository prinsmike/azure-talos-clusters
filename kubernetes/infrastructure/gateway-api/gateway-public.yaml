# Gateway listeners for public access via the vWAN firewall.
# This complements gateway-internal.yaml with public-domain (example.com) listeners.
#
# Traffic flow:
#   Internet -> vWAN Firewall (<vwan-firewall-public-ip>) -> DNAT -> Cilium Gateway (10.100.2.x)
#
# Prerequisites:
# - Gateway API CRDs installed
# - Cilium with gatewayAPI.enabled=true
# - DNAT rules configured on the vWAN firewall
# - cert-manager with the letsencrypt-prod ClusterIssuer (public zone, DNS-01)
---
# Certificate for the public domain - Let's Encrypt via DNS-01 (public zone).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway-tls
  namespace: kube-system
spec:
  secretName: public-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.example.com"
---
# Gateway with public domain listeners
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway-public
  namespace: kube-system
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    # HTTPS listener for the public domain
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    # HTTP listener for the public domain
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: All
---
# HTTP to HTTPS redirect for the public domain
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-http-to-https-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: cilium-gateway-public
      namespace: kube-system
      sectionName: http
  hostnames:
    - "*.example.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Test service route - points to echo-server
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-test
  namespace: echo-test
spec:
  parentRefs:
    - name: cilium-gateway-public
      namespace: kube-system
      sectionName: https
  hostnames:
    - test.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-server
          port: 80
