name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hygiene checks
        run: ./scripts/ci-hygiene.sh

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (all layers)
        run: |
          set -euo pipefail
          for d in \
            management \
            environments/dev/network-and-security \
            environments/dev/talos-cluster \
            environments/prod/network-and-security \
            environments/prod/talos-cluster; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

  yaml:
    name: YAML manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Parse all YAML
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml
          files = subprocess.check_output(
              ["git", "ls-files", "*.yaml", "*.yml"], text=True).split()
          bad = 0
          for f in files:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as e:
                  bad += 1
                  print(f"BAD: {f}\n     {e}")
          print(f"Parsed {len(files)} YAML file(s), {bad} invalid.")
          sys.exit(1 if bad else 0)
          PY
